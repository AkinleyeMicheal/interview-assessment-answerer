<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quizbox AI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0a;
  color: #e0e0e0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  touch-action: manipulation;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #111;
  border-bottom: 1px solid #222;
  flex-shrink: 0;
}
.header h1 { font-size: 18px; font-weight: 600; color: #fff; }
.header button {
  background: none;
  border: 1px solid #333;
  color: #aaa;
  font-size: 20px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header button:active { background: #222; }

.mode-bar {
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  background: #0d0d0d;
  border-bottom: 1px solid #1a1a1a;
  flex-shrink: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.mode-btn {
  padding: 6px 12px;
  border: 1px solid #333;
  border-radius: 20px;
  background: transparent;
  color: #888;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.mode-btn.active {
  background: #4ade80;
  color: #000;
  border-color: #4ade80;
  font-weight: 600;
}
.mode-btn:active { transform: scale(0.95); }

.camera-area {
  flex: 1;
  position: relative;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  min-height: 0;
}
.camera-area video, .camera-area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.camera-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.camera-overlay .scan-frame {
  width: 85%;
  height: 60%;
  border: 2px solid rgba(74, 222, 128, 0.5);
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(74, 222, 128, 0.15);
}
.no-camera {
  color: #555;
  font-size: 14px;
  text-align: center;
  padding: 20px;
}

.controls {
  padding: 16px;
  background: #111;
  border-top: 1px solid #222;
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}
.btn {
  flex: 1;
  padding: 16px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn:active { opacity: 0.7; }
.btn-capture {
  background: #16a34a;
  color: #fff;
}
.btn-capture.cooldown-active {
  background: #333;
  color: #999;
  cursor: not-allowed;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.controls {
  position: relative;
}

.timer-icon-btn {
  flex: 0 0 44px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #222;
  color: #aaa;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
}
.timer-icon-btn:active { opacity: 0.7; }

.cooldown-popup {
  position: absolute;
  bottom: 72px;
  right: 16px;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 12px 14px;
  z-index: 50;
  display: none;
  min-width: 180px;
}
.cooldown-popup.open { display: block; }
.cooldown-popup h4 {
  font-size: 12px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.cooldown-popup .cooldown-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.cooldown-popup input[type="number"] {
  width: 60px;
  padding: 6px 8px;
  background: #0a0a0a;
  border: 1px solid #333;
  border-radius: 6px;
  color: #e0e0e0;
  font-size: 14px;
  text-align: center;
}
.cooldown-popup input[type="number"]:focus {
  outline: none;
  border-color: #4ade80;
}
.cooldown-popup .cooldown-row label {
  font-size: 13px;
  color: #ccc;
}
.cooldown-popup .cooldown-actions {
  display: flex;
  gap: 6px;
}
.cooldown-popup .cooldown-actions button {
  flex: 1;
  padding: 6px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.cooldown-popup .btn-cooldown-save { background: #16a34a; color: #fff; }
.cooldown-popup .btn-cooldown-cancel { background: #333; color: #ccc; }

.answer-panel {
  background: #111;
  border-top: 1px solid #222;
  padding: 16px;
  max-height: 40dvh;
  overflow-y: auto;
  flex-shrink: 0;
  display: none;
}
.answer-panel.visible { display: block; }
.answer-panel .badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.badge.mcq { background: #7c3aed; color: #fff; }
.badge.essay { background: #ea580c; color: #fff; }
.badge.gemini { background: #2563eb; color: #fff; }
.badge.openrouter { background: #06b6d4; color: #fff; }
.badge.ollama { background: #16a34a; color: #fff; }
.answer-panel .question {
  font-size: 14px;
  color: #ccc;
  margin-bottom: 10px;
  line-height: 1.5;
}
.answer-panel .answer-label {
  font-size: 11px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
.answer-panel .answer {
  font-size: 18px;
  font-weight: 700;
  color: #4ade80;
  margin-bottom: 10px;
  line-height: 1.4;
}
.answer-panel .explanation {
  font-size: 13px;
  color: #999;
  line-height: 1.5;
}
.answer-panel .no-question {
  color: #f59e0b;
  font-size: 14px;
  text-align: center;
  padding: 10px 0;
}

.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  background: #0d0d0d;
  font-size: 11px;
  color: #555;
  flex-shrink: 0;
}
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
}
.status-dot.on { background: #4ade80; }
.status-dot.off { background: #ef4444; }

.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid #333;
  border-top-color: #4ade80;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.settings-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.settings-modal.open { display: flex; }
.settings-content {
  background: #1a1a1a;
  width: 100%;
  max-width: 500px;
  border-radius: 16px 16px 0 0;
  padding: 20px 16px 32px;
  max-height: 80dvh;
  overflow-y: auto;
}
.settings-content h2 {
  font-size: 16px;
  margin-bottom: 16px;
  color: #fff;
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  color: #888;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.field input, .field select {
  width: 100%;
  padding: 12px;
  background: #0a0a0a;
  border: 1px solid #333;
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 14px;
}
.field input:focus, .field select:focus {
  outline: none;
  border-color: #4ade80;
}
.field .hint {
  font-size: 11px;
  color: #666;
  margin-top: 4px;
}
.settings-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.settings-actions button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-save { background: #16a34a; color: #fff; }
.btn-cancel { background: #333; color: #ccc; }

.providers-section {
  margin-top: 16px;
  border-top: 1px solid #333;
  padding-top: 14px;
}
.providers-section h3 {
  font-size: 13px;
  color: #888;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.provider-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #222;
  font-size: 12px;
}
.provider-row:last-child { border-bottom: none; }
.provider-name { color: #ccc; font-weight: 500; }
.provider-status {
  display: flex;
  align-items: center;
  gap: 6px;
}
.provider-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
.provider-dot.ready { background: #4ade80; }
.provider-dot.cooldown { background: #f59e0b; }
.provider-dot.off { background: #ef4444; }
.provider-dot.configured { background: #4ade80; }
.provider-dot.not-configured { background: #555; }
.provider-detail { color: #666; font-size: 11px; }

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: #4ade80;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 200;
  display: none;
  white-space: nowrap;
  max-width: 90vw;
  text-align: center;
}
.toast.show { display: block; }

.qr-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
}
.qr-modal.open { display: flex; }
.qr-box {
  background: #1a1a1a;
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  max-width: 320px;
  width: 90%;
}
.qr-box h2 {
  font-size: 15px;
  color: #fff;
  margin-bottom: 6px;
}
.qr-box .qr-url {
  font-size: 12px;
  color: #4ade80;
  margin-bottom: 16px;
  word-break: break-all;
  font-family: monospace;
}
.qr-box canvas {
  border-radius: 8px;
  background: #fff;
  margin-bottom: 16px;
}
.qr-box .qr-hint {
  font-size: 11px;
  color: #666;
  margin-bottom: 14px;
}
.qr-box .qr-close {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: #ccc;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="header">
  <h1>Quizbox AI</h1>
  <div style="display:flex;gap:6px;">
    <button id="qrBtn" title="Show QR Code" style="background:none;border:1px solid #333;color:#aaa;font-size:18px;width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;">&#9641;</button>
    <button id="rotateKeyBtn" title="Rotate Gemini Key" style="background:none;border:1px solid #333;color:#aaa;font-size:16px;width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;">&#128273;</button>
    <button id="settingsBtn" title="Settings" style="background:none;border:1px solid #333;color:#aaa;font-size:20px;width:36px;height:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;">&#9881;</button>
  </div>
</div>

<div class="mode-bar" id="modeBar">
  <button class="mode-btn active" data-mode="openrouter">OpenRouter</button>
  <button class="mode-btn" data-mode="tesseract_openrouter">OCR + OpenRouter</button>
  <button class="mode-btn" data-mode="antigravity">Antigravity</button>
  <button class="mode-btn" data-mode="auto">Auto Fallback</button>
  <button class="mode-btn" data-mode="gemini_vision">Gemini</button>
  <button class="mode-btn" data-mode="ollama_text">Ollama</button>
</div>

<div class="status-bar">
  <span><span class="status-dot off" id="statusDot"></span><span id="statusText">Connecting...</span></span>
  <span id="providerText"></span>
  <span id="countText">0 answered</span>
</div>

<div class="camera-area" id="cameraArea">
  <video id="cameraPreview" autoplay playsinline muted></video>
  <div class="camera-overlay"><div class="scan-frame"></div></div>
  <div class="no-camera" id="noCamera" style="display:none;">Tap Capture to use phone camera</div>
</div>

<div class="answer-panel" id="answerPanel">
  <div id="answerContent"></div>
</div>

<div class="controls">
  <button class="btn btn-capture" id="captureBtn">Capture</button>
  <button class="timer-icon-btn" id="cooldownBtn" title="Set cooldown">&#9202;</button>
  <div class="cooldown-popup" id="cooldownPopup">
    <h4>Capture Cooldown</h4>
    <div class="cooldown-row">
      <input type="number" id="cooldownInput" min="1" max="120" value="20">
      <label>seconds</label>
    </div>
    <div class="cooldown-actions">
      <button class="btn-cooldown-cancel" id="cooldownPopupCancel">Cancel</button>
      <button class="btn-cooldown-save" id="cooldownPopupSave">Save</button>
    </div>
  </div>
</div>

<div class="settings-modal" id="settingsModal">
  <div class="settings-content">
    <h2>Settings</h2>
    <div class="field">
      <label>Gemini API Key</label>
      <input type="password" id="apiKeyInput" placeholder="AIza...">
    </div>
    <div class="field">
      <label>Gemini API Key 2 (optional, for rotation)</label>
      <input type="password" id="apiKeyInput2" placeholder="Second key...">
    </div>
    <div class="field">
      <label>Gemini API Key 3 (optional, for rotation)</label>
      <input type="password" id="apiKeyInput3" placeholder="Third key...">
    </div>
    <div class="field">
      <label>Camera URL (IP Webcam)</label>
      <input type="text" id="cameraUrlInput" placeholder="http://192.168.x.x:8080/video">
    </div>
    <div class="field">
      <label>OpenRouter API Key</label>
      <input type="password" id="openrouterKeyInput" placeholder="sk-or-...">
      <div class="hint">Free at openrouter.ai. Primary provider for quiz answering.</div>
    </div>
    <div class="field">
      <label>OpenRouter Model 1 (Primary)</label>
      <input type="text" id="openrouterModel1Input" placeholder="nvidia/nemotron-nano-2-vl:free">
    </div>
    <div class="field">
      <label>OpenRouter Model 2 (Backup)</label>
      <input type="text" id="openrouterModel2Input" placeholder="openrouter/free">
    </div>
    <div class="field">
      <label>Ollama Model</label>
      <input type="text" id="ollamaModelInput" placeholder="llava:7b">
    </div>
    <div class="field">
      <label>Ollama URL</label>
      <input type="text" id="ollamaUrlInput" placeholder="http://localhost:11434">
    </div>

    <div class="providers-section" id="providersSection">
      <h3>Provider Status</h3>
      <div id="providersList"></div>
      <div id="geminiKeyStatus" style="margin-top:10px;font-size:12px;color:#4ade80;"></div>
    </div>

    <div class="settings-actions">
      <button class="btn-cancel" id="cancelSettings">Cancel</button>
      <button class="btn-save" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<div class="qr-modal" id="qrModal">
  <div class="qr-box">
    <h2>Scan to Open on Phone</h2>
    <div class="qr-url" id="qrUrl"></div>
    <canvas id="qrCanvas"></canvas>
    <div class="qr-hint">Point your phone camera at this code</div>
    <button class="qr-close" id="qrClose">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/qr.js"></script>
<script>
const cameraPreview = document.getElementById('cameraPreview');
const noCamera = document.getElementById('noCamera');
const captureBtn = document.getElementById('captureBtn');
const answerPanel = document.getElementById('answerPanel');
const answerContent = document.getElementById('answerContent');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const providerText = document.getElementById('providerText');
const countText = document.getElementById('countText');
const settingsBtn = document.getElementById('settingsBtn');
const settingsModal = document.getElementById('settingsModal');
const apiKeyInput = document.getElementById('apiKeyInput');
const apiKeyInput2 = document.getElementById('apiKeyInput2');
const apiKeyInput3 = document.getElementById('apiKeyInput3');
const cameraUrlInput = document.getElementById('cameraUrlInput');
const openrouterKeyInput = document.getElementById('openrouterKeyInput');
const openrouterModel1Input = document.getElementById('openrouterModel1Input');
const openrouterModel2Input = document.getElementById('openrouterModel2Input');
const ollamaModelInput = document.getElementById('ollamaModelInput');
const ollamaUrlInput = document.getElementById('ollamaUrlInput');
const providersList = document.getElementById('providersList');
const geminiKeyStatus = document.getElementById('geminiKeyStatus');
const cancelSettings = document.getElementById('cancelSettings');
const saveSettings = document.getElementById('saveSettings');
const toast = document.getElementById('toast');
const modeBar = document.getElementById('modeBar');
const cooldownBtn = document.getElementById('cooldownBtn');
const cooldownPopup = document.getElementById('cooldownPopup');
const cooldownInput = document.getElementById('cooldownInput');
const cooldownPopupSave = document.getElementById('cooldownPopupSave');
const cooldownPopupCancel = document.getElementById('cooldownPopupCancel');
const rotateKeyBtn = document.getElementById('rotateKeyBtn');

let stream = null;
let answerCount = 0;
let isProcessing = false;
let currentMode = 'openrouter';

let cooldownDuration = parseInt(localStorage.getItem('quizbox_cooldown') || '20', 10);
let cooldownRemaining = 0;
let cooldownInterval = null;

async function initMode() {
  try {
    const res = await fetch('/api/settings');
    const data = await res.json();
    currentMode = data.OCR_MODE || 'openrouter';
    modeBar.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === currentMode);
    });
  } catch (e) {}
}

function showToast(msg, duration = 2500) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration);
}

function startCooldown(seconds) {
  cooldownRemaining = seconds;
  captureBtn.disabled = true;
  captureBtn.classList.add('cooldown-active');
  captureBtn.textContent = `Wait ${cooldownRemaining}s`;
  if (cooldownInterval) clearInterval(cooldownInterval);
  cooldownInterval = setInterval(() => {
    cooldownRemaining--;
    if (cooldownRemaining <= 0) {
      clearInterval(cooldownInterval);
      cooldownInterval = null;
      cooldownRemaining = 0;
      captureBtn.disabled = false;
      captureBtn.classList.remove('cooldown-active');
      captureBtn.textContent = 'Capture';
    } else {
      captureBtn.textContent = `Wait ${cooldownRemaining}s`;
    }
  }, 1000);
}

async function rotateGeminiKey() {
  try {
    const res = await fetch('/api/gemini-key/rotate', { method: 'POST' });
    const data = await res.json();
    if (data.rotated) {
      showToast(`Switched to key ${data.active_index + 1} - ready to continue`);
    } else {
      showToast(data.message || 'No rotation needed');
    }
  } catch (e) {
    showToast('Failed to rotate key');
  }
}

async function loadGeminiKeyStatus() {
  try {
    const res = await fetch('/api/gemini-key/status');
    const data = await res.json();
    if (data.total_keys > 0) {
      const active = data.keys.find(k => k.active);
      geminiKeyStatus.textContent = `Active key: ${active ? active.preview : 'none'} (${data.active_index + 1}/${data.total_keys})`;
    } else {
      geminiKeyStatus.textContent = 'No Gemini keys configured';
    }
  } catch (e) {
    geminiKeyStatus.textContent = '';
  }
}

async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    const data = await res.json();
    apiKeyInput.value = data.GEMINI_API_KEY || '';
    apiKeyInput2.value = data.GEMINI_API_KEY_2 || '';
    apiKeyInput3.value = data.GEMINI_API_KEY_3 || '';
    cameraUrlInput.value = data.CAMERA_URL || '';
    openrouterKeyInput.value = data.OPENROUTER_API_KEY || '';
    openrouterModel1Input.value = data.OPENROUTER_MODEL_1 || 'nvidia/nemotron-nano-2-vl:free';
    openrouterModel2Input.value = data.OPENROUTER_MODEL_2 || 'openrouter/free';
    ollamaModelInput.value = data.OLLAMA_MODEL || 'granite3.2-vision:2b';
    ollamaUrlInput.value = data.OLLAMA_URL || 'http://localhost:11434';
  } catch (e) {
    console.error('Failed to load settings', e);
  }
}

async function loadProviders() {
  try {
    const res = await fetch('/api/providers');
    const data = await res.json();
    let html = '';
    for (const [key, p] of Object.entries(data)) {
      let dotClass = 'not-configured';
      let detail = 'Not configured';
      if (!p.configured) {
        dotClass = 'not-configured';
        detail = 'No API key';
      } else if (p.cooldown_remaining > 0) {
        dotClass = 'cooldown';
        detail = `Rate-limited (${p.cooldown_remaining}s)`;
      } else if (p.available !== false) {
        dotClass = 'configured';
        detail = p.model || 'Ready';
      } else {
        dotClass = 'off';
        detail = 'Unavailable';
      }
      html += `<div class="provider-row">
        <span class="provider-name">${p.name}</span>
        <span class="provider-status">
          <span class="provider-detail">${detail}</span>
          <span class="provider-dot ${dotClass}"></span>
        </span>
      </div>`;
    }
    providersList.innerHTML = html;
  } catch (e) {
    providersList.innerHTML = '<div class="provider-row"><span class="provider-detail">Failed to load status</span></div>';
  }
}

async function checkCamera() {
  try {
    const res = await fetch('/api/camera-status');
    const data = await res.json();
    if (data.connected) {
      statusDot.className = 'status-dot on';
      statusText.textContent = 'IP Camera connected';
    } else {
      statusDot.className = 'status-dot off';
      statusText.textContent = 'Using phone camera';
    }
  } catch (e) {
    statusDot.className = 'status-dot off';
    statusText.textContent = 'Using phone camera';
  }
}

async function startPhoneCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    cameraPreview.srcObject = stream;
    cameraPreview.style.display = 'block';
    noCamera.style.display = 'none';
    statusDot.className = 'status-dot on';
    statusText.textContent = 'Phone camera active';
  } catch (e) {
    cameraPreview.style.display = 'none';
    noCamera.style.display = 'block';
    statusText.textContent = 'No camera available';
  }
}

function captureFrame() {
  const canvas = document.createElement('canvas');
  const video = cameraPreview;
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
}

async function sendCapture(base64Image) {
  const res = await fetch('/api/accept', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: base64Image })
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.detail || 'Server error');
  }
  return res.json();
}

function showAnswer(result) {
  answerPanel.classList.add('visible');

  if (!result.detected) {
    answerContent.innerHTML = '<div class="no-question">No question detected. Reposition camera and try again.</div>';
    return;
  }

  const typeBadge = result.type === 'MCQ'
    ? '<span class="badge mcq">MCQ</span>'
    : '<span class="badge essay">ESSAY</span>';

  let providerBadge = '';
  const provider = result.provider || result.mode_used || '';
  if (provider.includes('tesseract') && provider.includes('openrouter')) {
    providerBadge = '<span class="badge openrouter">OCR + OPENROUTER</span>';
  } else if (provider.includes('openrouter')) {
    providerBadge = '<span class="badge openrouter">OPENROUTER</span>';
  } else if (provider.includes('ollama')) {
    providerBadge = '<span class="badge ollama">OLLAMA</span>';
  } else if (provider.includes('tesseract') && provider.includes('gemini')) {
    providerBadge = '<span class="badge gemini">OCR + GEMINI</span>';
  } else {
    providerBadge = '<span class="badge gemini">GEMINI</span>';
  }

  answerContent.innerHTML = `
    ${typeBadge} ${providerBadge}
    <div class="question">${escapeHtml(result.question)}</div>
    <div class="answer-label">Answer</div>
    <div class="answer">${escapeHtml(result.answer)}</div>
    ${result.explanation ? `<div class="explanation">${escapeHtml(result.explanation)}</div>` : ''}
  `;

  if (result.provider) {
    providerText.textContent = result.provider;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

captureBtn.addEventListener('click', async () => {
  if (isProcessing) return;

  if (cooldownRemaining > 0) {
    showToast(`Wait ${cooldownRemaining}s before capturing again`);
    return;
  }

  let base64Image;
  if (stream) {
    base64Image = captureFrame();
  } else {
    await startPhoneCamera();
    if (!stream) {
      showToast('No camera available');
      return;
    }
    base64Image = captureFrame();
  }

  isProcessing = true;
  captureBtn.disabled = true;
  captureBtn.innerHTML = '<span class="spinner"></span>Analyzing...';

  try {
    const result = await sendCapture(base64Image);
    showAnswer(result);
    answerCount++;
    countText.textContent = `${answerCount} answered`;
    startCooldown(cooldownDuration);

    if (result.detected) {
      showToast('Question answered!');
    } else {
      showToast('No question found - try again');
    }
  } catch (e) {
    const msg = e.message || '';
    if (msg.includes('rate-limit') || msg.includes('Rate limit') || msg.includes('429') || msg.includes('All providers')) {
      showToast('Rate limited - rotating keys, please wait...');
      rotateGeminiKey();
    } else {
      showToast('Error: ' + msg);
    }
    captureBtn.disabled = false;
    captureBtn.classList.remove('cooldown-active');
    captureBtn.textContent = 'Capture';
  } finally {
    isProcessing = false;
  }
});

modeBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-btn');
  if (!btn) return;

  modeBar.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;

  fetch('/api/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ OCR_MODE: currentMode })
  });

  showToast(`Mode: ${btn.textContent.trim()}`);
});

settingsBtn.addEventListener('click', () => {
  loadSettings();
  loadProviders();
  loadGeminiKeyStatus();
  settingsModal.classList.add('open');
});

cancelSettings.addEventListener('click', () => {
  settingsModal.classList.remove('open');
});

settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) settingsModal.classList.remove('open');
});

saveSettings.addEventListener('click', async () => {
  try {
    await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        GEMINI_API_KEY: apiKeyInput.value,
        GEMINI_API_KEY_2: apiKeyInput2.value,
        GEMINI_API_KEY_3: apiKeyInput3.value,
        CAMERA_URL: cameraUrlInput.value,
        OPENROUTER_API_KEY: openrouterKeyInput.value,
        OPENROUTER_MODEL_1: openrouterModel1Input.value,
        OPENROUTER_MODEL_2: openrouterModel2Input.value,
        OLLAMA_MODEL: ollamaModelInput.value,
        OLLAMA_URL: ollamaUrlInput.value
      })
    });
    settingsModal.classList.remove('open');
    showToast('Settings saved');
    checkCamera();
  } catch (e) {
    showToast('Failed to save settings');
  }
});

startPhoneCamera();
checkCamera();
initMode();

cooldownBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  cooldownInput.value = cooldownDuration;
  cooldownPopup.classList.toggle('open');
});

cooldownPopupSave.addEventListener('click', (e) => {
  e.stopPropagation();
  const val = parseInt(cooldownInput.value, 10);
  if (isNaN(val) || val < 1) {
    showToast('Minimum cooldown is 1 second');
    return;
  }
  cooldownDuration = val;
  localStorage.setItem('quizbox_cooldown', String(val));
  cooldownPopup.classList.remove('open');
  showToast(`Cooldown set to ${val}s`);
});

cooldownPopupCancel.addEventListener('click', (e) => {
  e.stopPropagation();
  cooldownPopup.classList.remove('open');
});

document.addEventListener('click', (e) => {
  if (!cooldownPopup.contains(e.target) && e.target !== cooldownBtn) {
    cooldownPopup.classList.remove('open');
  }
});

rotateKeyBtn.addEventListener('click', async () => {
  showToast('Rotating Gemini key...');
  await rotateGeminiKey();
});

// QR Code
const qrBtn = document.getElementById('qrBtn');
const qrModal = document.getElementById('qrModal');
const qrCanvas = document.getElementById('qrCanvas');
const qrUrl = document.getElementById('qrUrl');
const qrClose = document.getElementById('qrClose');

function renderQR() {
  const url = window.location.href;
  qrUrl.textContent = url;
  try {
    const qr = QR.generate(url);
    const ctx = qrCanvas.getContext('2d');
    const size = qr.size;
    const scale = Math.min(250, Math.floor(280 / size));
    const margin = Math.floor((280 - size * scale) / 2);
    qrCanvas.width = size * scale + margin * 2;
    qrCanvas.height = size * scale + margin * 2;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, qrCanvas.width, qrCanvas.height);
    ctx.fillStyle = '#000';
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (qr.matrix[r][c]) {
          ctx.fillRect(margin + c * scale, margin + r * scale, scale, scale);
        }
      }
    }
  } catch (e) {
    console.error('QR generation failed', e);
  }
}

qrBtn.addEventListener('click', () => {
  renderQR();
  qrModal.classList.add('open');
});
qrClose.addEventListener('click', () => qrModal.classList.remove('open'));
qrModal.addEventListener('click', (e) => { if (e.target === qrModal) qrModal.classList.remove('open'); });
</script>
