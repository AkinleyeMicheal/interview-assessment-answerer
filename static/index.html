<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Quizbox AI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0a;
  color: #e0e0e0;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  touch-action: manipulation;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #111;
  border-bottom: 1px solid #222;
  flex-shrink: 0;
}
.header h1 { font-size: 18px; font-weight: 600; color: #fff; }
.header button {
  background: none;
  border: 1px solid #333;
  color: #aaa;
  font-size: 20px;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header button:active { background: #222; }

.ai-bar {
  display: flex;
  gap: 6px;
  padding: 8px 16px;
  background: #0d0d0d;
  border-bottom: 1px solid #1a1a1a;
  flex-shrink: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.ai-btn {
  padding: 6px 12px;
  border: 1px solid #333;
  border-radius: 20px;
  background: transparent;
  color: #888;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.ai-btn.active {
  background: #4ade80;
  color: #000;
  border-color: #4ade80;
  font-weight: 600;
}
.ai-btn:active { transform: scale(0.95); }

.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
  background: #0d0d0d;
  font-size: 11px;
  color: #555;
  flex-shrink: 0;
}
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 5px;
}
.status-dot.on { background: #4ade80; }
.status-dot.off { background: #ef4444; }

.camera-area {
  flex: 1;
  position: relative;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  min-height: 0;
}
.camera-area video, .camera-area img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.camera-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.camera-overlay .scan-frame {
  width: 85%;
  height: 60%;
  border: 2px solid rgba(74, 222, 128, 0.5);
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(74, 222, 128, 0.15);
}
.no-stream {
  color: #555;
  font-size: 14px;
  text-align: center;
  padding: 20px;
  line-height: 1.6;
}

.select-region-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 10;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background: #16a34a;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.select-region-btn:active { opacity: 0.7; }

.controls {
  padding: 16px;
  background: #111;
  border-top: 1px solid #222;
  display: flex;
  gap: 12px;
  flex-shrink: 0;
  position: relative;
}
.btn {
  flex: 1;
  padding: 16px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn:active { opacity: 0.7; }
.btn-capture {
  background: #16a34a;
  color: #fff;
}
.btn-capture.cooldown-active {
  background: #333;
  color: #999;
  cursor: not-allowed;
}
.btn-verified {
  background: #ea580c;
  color: #fff;
}
.btn-verified.cooldown-active {
  background: #333;
  color: #999;
  cursor: not-allowed;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.timer-icon-btn {
  flex: 0 0 44px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #222;
  color: #aaa;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
}
.timer-icon-btn:active { opacity: 0.7; }

.cooldown-popup {
  position: absolute;
  bottom: 72px;
  right: 16px;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 12px 14px;
  z-index: 50;
  display: none;
  min-width: 180px;
}
.cooldown-popup.open { display: block; }
.cooldown-popup h4 {
  font-size: 12px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.cooldown-popup .cooldown-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.cooldown-popup input[type="number"] {
  width: 60px;
  padding: 6px 8px;
  background: #0a0a0a;
  border: 1px solid #333;
  border-radius: 6px;
  color: #e0e0e0;
  font-size: 14px;
  text-align: center;
}
.cooldown-popup input[type="number"]:focus {
  outline: none;
  border-color: #4ade80;
}
.cooldown-popup .cooldown-row label {
  font-size: 13px;
  color: #ccc;
}
.cooldown-popup .cooldown-actions {
  display: flex;
  gap: 6px;
}
.cooldown-popup .cooldown-actions button {
  flex: 1;
  padding: 6px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.cooldown-popup .btn-cooldown-save { background: #16a34a; color: #fff; }
.cooldown-popup .btn-cooldown-cancel { background: #333; color: #ccc; }

.answer-panel {
  background: #111;
  border-top: 1px solid #222;
  padding: 16px;
  max-height: 55dvh;
  overflow-y: auto;
  flex-shrink: 0;
  display: none;
}
.answer-panel.visible { display: block; }
.answer-panel .badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.badge.mcq { background: #7c3aed; color: #fff; }
.badge.essay { background: #ea580c; color: #fff; }
.badge.gemini { background: #2563eb; color: #fff; }
.badge.gemini_search { background: #ea580c; color: #fff; }
.badge.not_verified { background: #78716c; color: #fff; }
.badge.timer { background: #555; color: #ccc; font-size: 10px; }
.answer-panel .question {
  font-size: 14px;
  color: #ccc;
  margin-bottom: 10px;
  line-height: 1.5;
}
.answer-panel .answer-label {
  font-size: 11px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
.answer-panel .answer {
  font-size: 18px;
  font-weight: 700;
  color: #4ade80;
  margin-bottom: 10px;
  line-height: 1.4;
}
.answer-panel .answer.essay {
  font-size: 15px;
  font-weight: 500;
  line-height: 1.6;
  white-space: pre-wrap;
}
.answer-panel .explanation {
  font-size: 13px;
  color: #999;
  line-height: 1.5;
}
.answer-panel .no-question {
  color: #f59e0b;
  font-size: 14px;
  text-align: center;
  padding: 10px 0;
}

.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid #333;
  border-top-color: #4ade80;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.settings-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.settings-modal.open { display: flex; }
.settings-content {
  background: #1a1a1a;
  width: 100%;
  max-width: 500px;
  border-radius: 16px 16px 0 0;
  padding: 20px 16px 32px;
  max-height: 80dvh;
  overflow-y: auto;
}
.settings-content h2 {
  font-size: 16px;
  margin-bottom: 16px;
  color: #fff;
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  color: #888;
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.field input, .field select {
  width: 100%;
  padding: 12px;
  background: #0a0a0a;
  border: 1px solid #333;
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 14px;
}
.field input:focus, .field select:focus {
  outline: none;
  border-color: #4ade80;
}
.field .hint {
  font-size: 11px;
  color: #666;
  margin-top: 4px;
}
.settings-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.settings-actions button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-save { background: #16a34a; color: #fff; }
.btn-cancel { background: #333; color: #ccc; }

.providers-section {
  margin-top: 16px;
  border-top: 1px solid #333;
  padding-top: 14px;
}
.providers-section h3 {
  font-size: 13px;
  color: #888;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.provider-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #222;
  font-size: 12px;
}
.provider-row:last-child { border-bottom: none; }
.provider-name { color: #ccc; font-weight: 500; }
.provider-status {
  display: flex;
  align-items: center;
  gap: 6px;
}
.provider-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
.provider-dot.ready { background: #4ade80; }
.provider-dot.cooldown { background: #f59e0b; }
.provider-dot.off { background: #ef4444; }
.provider-dot.configured { background: #4ade80; }
.provider-dot.not-configured { background: #555; }
.provider-detail { color: #666; font-size: 11px; }

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: #4ade80;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 200;
  display: none;
  white-space: nowrap;
  max-width: 90vw;
  text-align: center;
}
.toast.show { display: block; }

.qr-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
}
.qr-modal.open { display: flex; }
.qr-box {
  background: #1a1a1a;
  border-radius: 16px;
  padding: 24px;
  text-align: center;
  max-width: 320px;
  width: 90%;
}
.qr-box h2 {
  font-size: 15px;
  color: #fff;
  margin-bottom: 6px;
}
.qr-box .qr-url {
  font-size: 12px;
  color: #4ade80;
  margin-bottom: 16px;
  word-break: break-all;
  font-family: monospace;
}
.qr-box canvas {
  border-radius: 8px;
  background: #fff;
  margin-bottom: 16px;
}
.qr-box .qr-hint {
  font-size: 11px;
  color: #666;
  margin-bottom: 14px;
}
.qr-box .qr-close {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: #ccc;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="header">
  <h1>Quizbox AI</h1>
  <div style="display:flex;gap:6px;">
    <button id="qrBtn" title="Show QR Code">&#9641;</button>
    <button id="rotateKeyBtn" title="Rotate Gemini Key">&#128273;</button>
    <button id="settingsBtn" title="Settings">&#9881;</button>
  </div>
</div>

<div class="ai-bar" id="aiBar">
  <button class="ai-btn active" data-ai="groq_vision">Groq Vision</button>
  <button class="ai-btn" data-ai="gemini_vision">Gemini Vision</button>
</div>

<div class="status-bar">
  <span><span class="status-dot off" id="statusDot"></span><span id="statusText">Connecting...</span></span>
  <span id="providerText"></span>
  <span id="countText">0 answered</span>
</div>

<div class="camera-area" id="cameraArea">
  <img id="streamPreview" style="display:none;" alt="Screen stream">
  <div class="camera-overlay"><div class="scan-frame"></div></div>
  <div class="no-stream" id="noStream">
    <div style="font-size:48px;margin-bottom:12px;">&#128247;</div>
    <div>Tap <b>Select Region</b> to choose<br>the area to capture from your screen</div>
  </div>
  <button id="selectRegionBtn" class="select-region-btn">Select Region</button>
</div>

<div class="answer-panel" id="answerPanel">
  <div id="answerContent"></div>
</div>

<div class="controls">
  <button class="btn btn-capture" id="captureQuickBtn" disabled>Quick Answer</button>
  <button class="btn btn-verified" id="captureVerifiedBtn" disabled style="display:none;">Web Verified</button>
  <button class="btn btn-capture" id="captureBtn" disabled style="display:none;">Capture</button>
  <button class="timer-icon-btn" id="cooldownBtn" title="Set cooldown">&#9202;</button>
  <div class="cooldown-popup" id="cooldownPopup">
    <h4>Capture Cooldown</h4>
    <div class="cooldown-row">
      <input type="number" id="cooldownInput" min="1" max="120" value="20">
      <label>seconds</label>
    </div>
    <div class="cooldown-actions">
      <button class="btn-cooldown-cancel" id="cooldownPopupCancel">Cancel</button>
      <button class="btn-cooldown-save" id="cooldownPopupSave">Save</button>
    </div>
  </div>
</div>

<div class="settings-modal" id="settingsModal">
  <div class="settings-content">
    <h2>Settings</h2>
    <div class="field">
      <label>Groq API Key</label>
      <input type="password" id="groqKeyInput" placeholder="gsk_...">
      <div class="hint">Free at console.groq.com. Primary provider.</div>
    </div>
    <div class="field">
      <label>Gemini Vision API Key</label>
      <input type="password" id="apiKeyInput" placeholder="AIza...">
    </div>
    <div class="field">
      <label>Gemini API Key 2 (optional)</label>
      <input type="password" id="apiKeyInput2" placeholder="Second key...">
    </div>
    <div class="field">
      <label>Gemini API Key 3 (optional)</label>
      <input type="password" id="apiKeyInput3" placeholder="Third key...">
    </div>
    <div class="field">
      <label>Gemini API Key 4 (optional)</label>
      <input type="password" id="apiKeyInput4" placeholder="Fourth key...">
    </div>
    <div class="field">
      <label>Gemini API Key 5 (optional)</label>
      <input type="password" id="apiKeyInput5" placeholder="Fifth key...">
    </div>
    <div class="providers-section" id="providersSection">
      <h3>Provider Status</h3>
      <div id="providersList"></div>
      <div id="geminiKeyStatus" style="margin-top:10px;font-size:12px;color:#4ade80;"></div>
    </div>

    <div class="settings-actions">
      <button class="btn-cancel" id="cancelSettings">Cancel</button>
      <button class="btn-save" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<div class="qr-modal" id="qrModal">
  <div class="qr-box">
    <h2>Scan to Open on Phone</h2>
    <div class="qr-url" id="qrUrl"></div>
    <canvas id="qrCanvas"></canvas>
    <div class="qr-hint">Point your phone camera at this code</div>
    <button class="qr-close" id="qrClose">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/qr.js"></script>
<script>
const streamPreview = document.getElementById('streamPreview');
const selectRegionBtn = document.getElementById('selectRegionBtn');
const noStream = document.getElementById('noStream');
const captureBtn = document.getElementById('captureBtn');
const captureQuickBtn = document.getElementById('captureQuickBtn');
const captureVerifiedBtn = document.getElementById('captureVerifiedBtn');
const answerPanel = document.getElementById('answerPanel');
const answerContent = document.getElementById('answerContent');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const providerText = document.getElementById('providerText');
const countText = document.getElementById('countText');
const settingsBtn = document.getElementById('settingsBtn');
const settingsModal = document.getElementById('settingsModal');
const apiKeyInput = document.getElementById('apiKeyInput');
const apiKeyInput2 = document.getElementById('apiKeyInput2');
const apiKeyInput3 = document.getElementById('apiKeyInput3');
const apiKeyInput4 = document.getElementById('apiKeyInput4');
const apiKeyInput5 = document.getElementById('apiKeyInput5');
const groqKeyInput = document.getElementById('groqKeyInput');
const providersList = document.getElementById('providersList');
const geminiKeyStatus = document.getElementById('geminiKeyStatus');
const cancelSettings = document.getElementById('cancelSettings');
const saveSettings = document.getElementById('saveSettings');
const toast = document.getElementById('toast');
const aiBar = document.getElementById('aiBar');
const cooldownBtn = document.getElementById('cooldownBtn');
const cooldownPopup = document.getElementById('cooldownPopup');
const cooldownInput = document.getElementById('cooldownInput');
const cooldownPopupSave = document.getElementById('cooldownPopupSave');
const cooldownPopupCancel = document.getElementById('cooldownPopupCancel');
const rotateKeyBtn = document.getElementById('rotateKeyBtn');

let answerCount = 0;
let isProcessing = false;
let currentAI = 'groq_vision';
let streamActive = false;
let streamGeneration = 0;
let displayedFrameUrl = null;

let cooldownDuration = parseInt(localStorage.getItem('quizbox_cooldown') || '20', 10);
let cooldownRemaining = 0;
let cooldownInterval = null;

function showToast(msg, duration = 2500) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration);
}

function startCooldown(seconds) {
  cooldownRemaining = seconds;
  captureQuickBtn.disabled = true;
  captureVerifiedBtn.disabled = true;
  captureBtn.disabled = true;
  captureQuickBtn.classList.add('cooldown-active');
  captureVerifiedBtn.classList.add('cooldown-active');
  captureBtn.classList.add('cooldown-active');
  captureQuickBtn.textContent = `Wait ${cooldownRemaining}s`;
  captureVerifiedBtn.textContent = `Wait ${cooldownRemaining}s`;
  captureBtn.textContent = `Wait ${cooldownRemaining}s`;
  if (cooldownInterval) clearInterval(cooldownInterval);
  cooldownInterval = setInterval(() => {
    cooldownRemaining--;
    if (cooldownRemaining <= 0) {
      clearInterval(cooldownInterval);
      cooldownInterval = null;
      cooldownRemaining = 0;
      captureQuickBtn.classList.remove('cooldown-active');
      captureVerifiedBtn.classList.remove('cooldown-active');
      captureBtn.classList.remove('cooldown-active');
      captureQuickBtn.textContent = 'Quick Answer';
      captureVerifiedBtn.textContent = 'Web Verified';
      captureBtn.textContent = 'Capture';
      updateCaptureButtons();
    } else {
      captureQuickBtn.textContent = `Wait ${cooldownRemaining}s`;
      captureVerifiedBtn.textContent = `Wait ${cooldownRemaining}s`;
      captureBtn.textContent = `Wait ${cooldownRemaining}s`;
    }
  }, 1000);
}

async function rotateGeminiKey() {
  try {
    const res = await fetch('/api/gemini-key/rotate', { method: 'POST' });
    const data = await res.json();
    if (data.rotated) {
      showToast(`Switched to key ${data.active_index + 1} - ready to continue`);
    } else {
      showToast(data.message || 'No rotation needed');
    }
  } catch (e) {
    showToast('Failed to rotate key');
  }
}

async function loadGeminiKeyStatus() {
  try {
    const res = await fetch('/api/gemini-key/status');
    const data = await res.json();
    if (data.total_keys > 0) {
      const active = data.keys.find(k => k.active);
      geminiKeyStatus.textContent = `Active key: ${active ? active.preview : 'none'} (${data.active_index + 1}/${data.total_keys})`;
    } else {
      geminiKeyStatus.textContent = 'No Gemini keys configured';
    }
  } catch (e) {
    geminiKeyStatus.textContent = '';
  }
}

async function loadSettings() {
  try {
    const res = await fetch('/api/settings');
    const data = await res.json();
    apiKeyInput.value = data.GEMINI_API_KEY || '';
    apiKeyInput2.value = data.GEMINI_API_KEY_2 || '';
    apiKeyInput3.value = data.GEMINI_API_KEY_3 || '';
    apiKeyInput4.value = data.GEMINI_API_KEY_4 || '';
    apiKeyInput5.value = data.GEMINI_API_KEY_5 || '';
    groqKeyInput.value = data.GROQ_API_KEY || '';
  } catch (e) {
    console.error('Failed to load settings', e);
  }
}

async function loadProviders() {
  try {
    const res = await fetch('/api/providers');
    const data = await res.json();
    let html = '';
    for (const [key, p] of Object.entries(data)) {
      let dotClass = 'not-configured';
      let detail = 'Not configured';
      if (!p.configured) {
        detail = 'No API key';
      } else if (p.cooldown_remaining > 0) {
        dotClass = 'cooldown';
        detail = `Rate-limited (${p.cooldown_remaining}s)`;
      } else if (p.available !== false) {
        dotClass = 'configured';
        detail = p.model || 'Ready';
      }
      const statusExtra = p.groq_status && !p.groq_status.valid ? ' (key invalid)' : '';
      html += `<div class="provider-row">
        <span class="provider-name">${p.name}</span>
        <span class="provider-status">
          <span class="provider-detail">${detail}${statusExtra}</span>
          <span class="provider-dot ${dotClass}"></span>
        </span>
      </div>`;
    }
    providersList.innerHTML = html;
  } catch (e) {
    providersList.innerHTML = '<div class="provider-row"><span class="provider-detail">Failed to load status</span></div>';
  }
}

async function checkScreenStatus() {
  try {
    const res = await fetch('/api/screen/status');
    const data = await res.json();
    if (data.running && data.region) {
      activateStream();
    }
  } catch (e) {}
}

function activateStream() {
  const generation = ++streamGeneration;
  streamActive = true;
  streamPreview.style.display = 'block';
  noStream.style.display = 'none';
  statusDot.className = 'status-dot on';
  statusText.textContent = 'Screen capture active';
  updateCaptureButtons();
  pullLatestFrames(generation);
}

function updateCaptureButtons() {
  const groqActive = currentAI === 'groq_vision';
  captureQuickBtn.style.display = groqActive ? '' : 'none';
  captureVerifiedBtn.style.display = groqActive ? '' : 'none';
  captureBtn.style.display = groqActive ? 'none' : '';

  if (!streamActive) {
    captureQuickBtn.disabled = true;
    captureVerifiedBtn.disabled = true;
    captureBtn.disabled = true;
    return;
  }

  if (cooldownRemaining > 0) {
    captureQuickBtn.disabled = true;
    captureVerifiedBtn.disabled = true;
    captureBtn.disabled = true;
  } else {
    captureQuickBtn.disabled = false;
    captureVerifiedBtn.disabled = false;
    captureBtn.disabled = false;
  }
}

async function pullLatestFrames(generation) {
  const frameIntervalMs = 1000 / 15;
  while (streamActive && generation === streamGeneration) {
    const startedAt = performance.now();
    try {
      // Fetching the next image only after the current one decoded gives the
      // phone explicit back-pressure: no browser or TCP queue of old frames.
      const res = await fetch('/api/screen/frame?nonce=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(`Frame request failed (${res.status})`);
      const nextUrl = URL.createObjectURL(await res.blob());

      await new Promise((resolve, reject) => {
        streamPreview.onload = resolve;
        streamPreview.onerror = reject;
        streamPreview.src = nextUrl;
      });

      if (generation !== streamGeneration) {
        URL.revokeObjectURL(nextUrl);
        return;
      }
      if (displayedFrameUrl) URL.revokeObjectURL(displayedFrameUrl);
      displayedFrameUrl = nextUrl;
    } catch (e) {
      if (generation !== streamGeneration) return;
      // The capture worker may need a moment to create its first JPEG. Retry
      // instead of leaving the UI on a permanent stale/error state.
      await new Promise(resolve => setTimeout(resolve, 150));
      continue;
    }

    const wait = frameIntervalMs - (performance.now() - startedAt);
    if (wait > 0) await new Promise(resolve => setTimeout(resolve, wait));
  }
}

selectRegionBtn.addEventListener('click', async () => {
  showToast('Draw a rectangle on your screen...');
  try {
    const res = await fetch('/api/screen/select', { method: 'POST' });
    const data = await res.json();
    if (data.selected) {

    }
  } catch (e) {

  }
});

captureQuickBtn.addEventListener('click', () => handleCapture('quick'));
captureVerifiedBtn.addEventListener('click', () => handleCapture('verified'));
captureBtn.addEventListener('click', () => handleCapture('quick'));

async function handleCapture(strategy) {
  if (isProcessing) return;

  if (cooldownRemaining > 0) {
    showToast(`Wait ${cooldownRemaining}s before capturing again`);
    return;
  }

  if (!streamActive || !streamPreview.src || streamPreview.naturalWidth === 0) {
    showToast('No screen stream. Select a region first.');
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.width = streamPreview.naturalWidth;
  canvas.height = streamPreview.naturalHeight;
  canvas.getContext('2d').drawImage(streamPreview, 0, 0);
  const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

  const activeBtn = strategy === 'verified' ? captureVerifiedBtn : (currentAI === 'groq_vision' ? captureQuickBtn : captureBtn);

  isProcessing = true;
  captureQuickBtn.disabled = true;
  captureVerifiedBtn.disabled = true;
  captureBtn.disabled = true;
  activeBtn.innerHTML = '<span class="spinner"></span>Analyzing...';

  try {
    const result = await sendCapture(base64Image, strategy);
    showAnswer(result);
    answerCount++;
    countText.textContent = `${answerCount} answered`;
    startCooldown(cooldownDuration);

    if (result.detected) {
      showToast('Question answered!');
    } else {
      showToast('No question found - try again');
    }
  } catch (e) {
    const msg = e.message || '';
    if (msg.includes('rate-limit') || msg.includes('Rate limit') || msg.includes('429') || msg.includes('All providers')) {
      showToast('Rate limited - rotating keys, please wait...');
      rotateGeminiKey();
    } else {
      showToast('Error: ' + msg);
    }
    captureQuickBtn.classList.remove('cooldown-active');
    captureVerifiedBtn.classList.remove('cooldown-active');
    captureBtn.classList.remove('cooldown-active');
    captureQuickBtn.textContent = 'Quick Answer';
    captureVerifiedBtn.textContent = 'Web Verified';
    captureBtn.textContent = 'Capture';
    updateCaptureButtons();
  } finally {
    isProcessing = false;
  }
}

aiBar.addEventListener('click', async (e) => {
  const btn = e.target.closest('.ai-btn');
  if (!btn) return;

  aiBar.querySelectorAll('.ai-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentAI = btn.dataset.ai;

  updateCaptureButtons();

  try {
    await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ OCR_MODE: currentAI })
    });
  } catch (e) {
    showToast('Mode selected locally; settings could not be saved');
  }

  showToast(`AI: ${btn.textContent.trim()}`);
});

async function sendCapture(base64Image, strategy) {
  const res = await fetch('/api/accept', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: base64Image, mode: currentAI, groq_strategy: strategy })
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.detail || 'Server error');
  }
  return res.json();
}

function showAnswer(result) {
  answerPanel.classList.add('visible');

  if (!result.detected) {
    answerContent.innerHTML = '<div class="no-question">No question detected. Reposition and try again.</div>';
    return;
  }

  const typeBadge = result.type === 'MCQ'
    ? '<span class="badge mcq">MCQ</span>'
    : '<span class="badge essay">ESSAY</span>';

  let providerBadge = '';
  const provider = result.provider || result.mode_used || '';
  const answerMode = result.answer_mode || '';

  if (provider.includes('groq')) {
    if (answerMode === 'verified') {
      if (result.search_used) {
        providerBadge = '<span class="badge gemini_search">WEB VERIFIED</span>';
      } else if (result.fallback_reason || result.search_error) {
        providerBadge = '<span class="badge not_verified">NOT WEB VERIFIED</span>';
      } else {
        providerBadge = '<span class="badge gemini_search">WEB VERIFIED</span>';
      }
    } else {
      providerBadge = '<span class="badge gemini_search">QUICK ANSWER</span>';
    }
  } else if (provider.includes('gemini')) {
    providerBadge = '<span class="badge gemini">GEMINI</span>';
  }

  const timerBadge = result.response_time
    ? `<span class="badge timer">${result.response_time}</span>`
    : '';

  let sourcesHtml = '';
  if (result.sources && result.sources.length > 0) {
    sourcesHtml = '<div style="margin-top:10px;font-size:11px;color:#888;">Sources: ';
    sourcesHtml += result.sources.map((s, i) =>
      `<a href="${escapeHtml(s.uri)}" target="_blank" rel="noopener" style="color:#60a5fa;text-decoration:none;">${escapeHtml(s.title || s.uri)}</a>`
    ).join(' &middot; ');
    sourcesHtml += '</div>';
  }

  const fallbackHtml = result.fallback_reason
    ? `<div style="margin-top:6px;font-size:11px;color:#f59e0b;">${escapeHtml(result.fallback_reason)}</div>`
    : '';

  const answerClass = result.type === 'ESSAY' ? 'answer essay' : 'answer';

  answerContent.innerHTML = `
    ${typeBadge} ${providerBadge} ${timerBadge}
    <div class="question">${escapeHtml(result.question)}</div>
    <div class="answer-label">Answer</div>
    <div class="${answerClass}">${escapeHtml(result.answer)}</div>
    ${result.explanation ? `<div class="explanation">${escapeHtml(result.explanation)}</div>` : ''}
    ${fallbackHtml}
    ${sourcesHtml}
  `;

  if (result.provider) {
    providerText.textContent = result.provider;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// QR Code
const qrBtn = document.getElementById('qrBtn');
const qrModal = document.getElementById('qrModal');
const qrCanvas = document.getElementById('qrCanvas');
const qrUrl = document.getElementById('qrUrl');
const qrClose = document.getElementById('qrClose');

function renderQR() {
  const url = window.location.href;
  qrUrl.textContent = url;
  try {
    const qr = QR.generate(url);
    const ctx = qrCanvas.getContext('2d');
    const size = qr.size;
    const scale = Math.min(250, Math.floor(280 / size));
    const margin = Math.floor((280 - size * scale) / 2);
    qrCanvas.width = size * scale + margin * 2;
    qrCanvas.height = size * scale + margin * 2;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, qrCanvas.width, qrCanvas.height);
    ctx.fillStyle = '#000';
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (qr.matrix[r][c]) {
          ctx.fillRect(margin + c * scale, margin + r * scale, scale, scale);
        }
      }
    }
  } catch (e) {
    console.error('QR generation failed', e);
  }
}

qrBtn.addEventListener('click', () => {
  renderQR();
  qrModal.classList.add('open');
});
qrClose.addEventListener('click', () => qrModal.classList.remove('open'));
qrModal.addEventListener('click', (e) => { if (e.target === qrModal) qrModal.classList.remove('open'); });

    const res = await fetch('/api/settings');

        btn.classList.toggle('active', btn.dataset.ai === currentAI);
      });
    }
  } catch (e) {}
  updateCaptureButtons();
})();
